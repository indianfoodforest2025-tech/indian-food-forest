<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen Display System | Indian Food Forest</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Links (admin.css will contain KDS dark-mode grid styles) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body kds-theme">

    <!-- ============================================== -->
    <!-- 0. KITCHEN SECURE PIN OVERLAY -->
    <!-- ============================================== -->
    <div id="kitchen-login-screen" class="fullscreen-overlay" style="background: var(--primary-navy); z-index: 9999;">
        <div class="modal-card text-center shadow-lg">
            <div class="logo-container mx-auto mb-3" style="width: 70px; height: 70px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-fire-burner text-danger fa-2x"></i>
            </div>
            <h2 class="mb-2">Kitchen Display</h2>
            <p class="text-muted text-sm mb-4">Enter 4-Digit Chef PIN</p>
            
            <input type="password" id="kitchen-passcode" class="input-group" placeholder="••••" maxlength="4" inputmode="numeric" pattern="[0-9]*" style="font-size: 32px; text-align: center; letter-spacing: 15px; font-weight: bold; padding: 15px;" autocomplete="off">
            <p id="kitchen-login-error" class="text-danger text-sm hidden mt-2">Incorrect PIN!</p>
            
            <button id="btn-kitchen-login" class="btn-primary btn-large w-100 mt-4">
                <i class="fa-solid fa-unlock-keyhole"></i> Enter Kitchen
            </button>
        </div>
    </div>

    <!-- 1. HIDDEN AUDIO TAG (For Loud Kitchen Bell Loop) -->
    <!-- Sound source will be handled in JS, but tag is pre-defined here -->
    <audio id="kds-audio-bell" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- 2. KDS TOP HEADER -->
    <header class="kds-header">
        <div class="header-left">
            <i class="fa-solid fa-fire-burner text-primary"></i>
            <h1>Kitchen Display System</h1>
        </div>
        
        <div class="header-right">
            <!-- Audio Permission Toggle (Crucial for Chrome/Safari autoplay policies) -->
            <button id="btn-toggle-sound" class="btn-outline-danger">
                <i class="fa-solid fa-volume-xmark"></i> Sound Off (Click to Enable)
            </button>
            <div class="live-clock" id="kds-live-clock">
                00:00:00 AM
            </div>
        </div>
    </header>

    <!-- 3. MAIN KDS GRID (Orders will populate here real-time) -->
    <main class="kds-main">
        
        <!-- Empty State (Jab koi order na ho) -->
        <div id="kds-empty-state" class="empty-state text-center">
            <i class="fa-solid fa-mug-hot"></i>
            <h2>Kitchen is clear!</h2>
            <p>Waiting for new orders...</p>
        </div>

        <!-- Orders Grid Container -->
        <div id="kds-orders-grid" class="kds-grid hidden">
