<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu | Indian Food Forest</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/customer.css">

    <!-- STRICT FIX: Force Hidden Elements to stay Hidden -->
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="customer-body bg-light">

    <!-- 1. TOP NAVIGATION & CONTROLS -->
    <header class="menu-header sticky-top">
        <div class="header-top">
            <div class="brand-mini">
                <i class="fa-solid fa-leaf text-primary"></i>
                <span class="brand-title">Indian Food Forest</span>
            </div>
            <div class="table-badge-small">
                <i class="fa-solid fa-bell-concierge"></i> Table <span id="nav-table-no">--</span>
            </div>
        </div>

        <div class="header-controls">
            <!-- Veg / Non-Veg Toggle -->
            <div class="veg-toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="veg-only-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="toggle-label"><i class="fa-solid fa-leaf text-success"></i> Veg Only</span>
            </div>
            
            <!-- Quick Action: Water Request -->
            <button id="btn-request-water" class="btn-icon-text">
                <i class="fa-solid fa-glass-water"></i> Water
            </button>
        </div>

        <!-- Horizontal Scrollable Categories -->
        <nav class="category-nav">
            <ul class="category-list" id="category-list">
                <li class="category-item active" data-category="all">All</li>
                <li class="category-item" data-category="starters">Starters</li>
                <li class="category-item" data-category="main-course">Main Course</li>
                <li class="category-item" data-category="beverages">Beverages</li>
                <li class="category-item" data-category="desserts">Desserts</li>
            </ul>
        </nav>
    </header>

    <!-- 2. MAIN MENU GRID -->
    <main class="menu-main-content">
        
        <!-- SKELETON LOADERS -->
        <div id="menu-skeleton-loader" class="menu-grid">
            <div class="skeleton-card">
                <div class="skeleton-img pulse"></div>
                <div class="skeleton-text title pulse"></div>
                <div class="skeleton-text desc pulse"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-text price pulse"></div>
                    <div class="skeleton-btn pulse"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-img pulse"></div>
                <div class="skeleton-text title pulse"></div>
                <div class="skeleton-text desc pulse"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-text price pulse"></div>
                    <div class="skeleton-btn pulse"></div>
                </div>
            </div>
        </div>

        <!-- ACTUAL MENU ITEMS -->
        <div id="menu-items-container" class="menu-grid hidden"></div>
        
        <!-- Bottom space so last item is not hidden behind cart -->
        <div class="menu-bottom-spacer" style="height: 100px;"></div>
    </main>

    <!-- 3. COMPACT FLOATING CART BAR (CHOTA PILL DESIGN) -->
    <div id="floating-cart-bar" class="floating-cart hidden slide-up-cart" style="cursor: pointer; background: #0F172A !important; padding: 6px 6px 6px 20px !important; display: flex !important; align-items: center !important; justify-content: space-between !important; gap: 15px !important; border-radius: 50px !important; box-shadow: 0 10px 25px rgba(0,0,0,0.3) !important; z-index: 999 !important; width: max-content !important; min-width: 220px; position: fixed !important; bottom: 20px !important; left: 50% !important; transform: translateX(-50%) !important; margin: 0 !important; border: 1px solid #334155;">
        
        <!-- Left Side: Price -->
        <div class="cart-summary" style="display: flex; flex-direction: column; text-align: left;">
            <span id="cart-item-count" style="font-size: 10px; color: #94A3B8; font-weight: 600; line-height: 1.2;">0 ITEMS</span>
            <span id="cart-total-price" style="font-size: 16px; font-weight: 700; color: white; line-height: 1.2;">₹0</span>
        </div>
        
        <!-- Right Side: View Cart Button -->
        <button id="btn-view-cart" onclick="document.getElementById('cart-review-modal').classList.remove('hidden');" style="background: #16A34A !important; color: white !important; border: none !important; padding: 10px 20px !important; border-radius: 40px !important; font-weight: 600 !important; font-size: 14px !important; display: flex !important; align-items: center !important; gap: 6px !important; margin: 0 !important;">
            View Cart <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <!-- 4. CART REVIEW MODAL -->
    <div id="cart-review-modal" class="modal-overlay hidden">
        <div class="modal-card bottom-sheet slide-up">
            <div class="modal-header d-flex-between">
                <h3>Your Order</h3>
                <!-- DIRECT FIX for Cross Button -->
                <button id="btn-close-cart" class="btn-icon" onclick="document.getElementById('cart-review-modal').classList.add('hidden');"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="modal-body cart-body">
                <ul id="cart-items-list" class="cart-items-list"></ul>
                
                <div class="special-instruction-box">
                    <label for="cooking-instructions"><i class="fa-solid fa-message"></i> Cooking Instructions (Optional)</label>
                    <textarea id="cooking-instructions" rows="2" placeholder="E.g., Less spicy, no onions..."></textarea>
                </div>
                
                <!-- BILL SUMMARY HATA DIYA GAYA HAI -->
                
            </div>
            
            <!-- MODAL FOOTER WITH PLACE ORDER BUTTON ON LEFT -->
            <div class="modal-footer" style="text-align: left;">
                <button id="btn-place-order" class="btn-primary" style="width: max-content; padding: 12px 30px; border-radius: 12px; font-size: 16px; font-weight: 600;">
                    Place Order <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="toast hidden">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Item added!</span>
    </div>

    <!-- JavaScript Files -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/session.js"></script>
    <script type="module" src="js/customer-app.js"></script>
    
</body>
</html>
