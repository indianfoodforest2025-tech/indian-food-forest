<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Under Maintenance | Indian Food Forest</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0F172A;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .maintenance-card {
            background: #1E293B;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }
        h1 { font-size: 22px; margin-bottom: 10px; font-weight: 600; }
        p { font-size: 13px; color: #94A3B8; line-height: 1.5; margin-bottom: 25px; }
        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.15);
            color: #60A5FA;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="icon-box">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <h1>System Under Maintenance</h1>
        <p>We are currently upgrading our digital ordering and kitchen systems to serve you better. Please check back shortly.</p>
        <span class="badge">INDIAN FOOD FOREST TECH</span>
    </div>
</body>
</html>
